<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrição no Sorteio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #80deea);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      max-width: 420px;
      width: 100%;
      text-align: center;
      transition: all 0.3s ease-in-out;
    }

    h2 {
      margin-bottom: 1.5rem;
      color: #00796b;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      text-align: left;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 1rem;
    }

    button {
      padding: 12px;
      width: 100%;
      background: #00acc1;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #00838f;
    }

    .success {
      margin-top: 1.5rem;
      color: #388e3c;
      background-color: #e8f5e9;
      padding: 0.75rem 1rem;
      border-radius: 6px;
      display: none;
      animation: fadeIn 0.6s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Participe do Sorteio</h2>
    <form id="sorteioForm" autocomplete="off">
      <label for="nome">Nome completo:</label>
      <input type="text" id="nome" name="nome" required>
      <button type="submit">Quero Participar</button>
      <div class="success" id="mensagemSucesso">🎉 Inscrição registrada com sucesso!</div>
    </form>
  </div>

  <script>
    const form = document.getElementById('sorteioForm');
    const mensagem = document.getElementById('mensagemSucesso');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      if (!nome) return;

      try {
        await fetch('https://api.sheetmonkey.io/form/g7BAJADGUDc3kjJ72WSDnG', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ Nome: nome })
        });

        form.reset();
        mensagem.style.display = 'block';
        setTimeout(() => mensagem.style.display = 'none', 5000); // Oculta após 5s
      } catch (error) {
        alert('Erro ao registrar sua inscrição. Tente novamente.');
      }
    });
  </script>
</body>
</html>
